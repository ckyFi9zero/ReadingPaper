  - id: insight-hierarchy
    name: 用多尺度局部上下文应对稀疏变化
    techniques:
    - MSG/MRG
    - 多尺度
    - FPS
    - random input dropout
    status: inferred
    transfer_boundary: ScanNet 密度偏移下仍有下降；点集分类/分割中的稀疏鲁棒性不等于已经验证天气噪声过滤。
    source_papers:
    - pointnet-plus-plus-2017
    evidence:
    - *id005
    principle:
      text: 单个邻域尺度的证据会随采样密度变化而失稳；组合尺度和层次上下文，让特征不只依赖一个固定分辨率。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: pointnet-plus-plus-2017
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    playbook:
      use_when:
        text: 需要学习局部形状、且输入点数或区域密度变化时，可把层次分组和多尺度表示作为候选。
        basis: analyst-inference
        status: inferred
        evidence:
        - paper: pointnet-plus-plus-2017
          stage: first-pass
          anchor: section-04
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      mechanism:
        text: PointNet++ 递归执行 FPS、ball query 与局部 PointNet；MSG 在同一中心组合多个尺度，MRG 组合跨层与原始区域特征。MSG 与 MRG 是替代设计。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-plus-plus-2017
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      engineering_tricks:
        text: 邻域坐标改为相对中心坐标；random input dropout 在训练中覆盖不同稀疏度；分割通过插值与 skip links 回到原始点。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-plus-plus-2017
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      assumptions_cost:
        text: 需要合适的距离度量、采样和半径；MSG 重复计算较多，MRG 试图降低大邻域计算。
        basis: analyst-inference
        status: inferred
        evidence:
        - paper: pointnet-plus-plus-2017
          stage: first-pass
          anchor: section-08
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      failure_boundary:
        text: ScanNet 密度偏移下仍有下降；点集分类/分割中的稀疏鲁棒性不等于已经验证天气噪声过滤。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-plus-plus-2017
          stage: first-pass
          anchor: section-08
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      evidence_scope:
        text: Figs. 4–5 比较 SSG、MSG、MRG 与 dropout；ModelNet40 的输入点数/法向量条件不同，不能把所有准确率差都归于结构。
