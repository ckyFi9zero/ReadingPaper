        status: inferred
        evidence:
        - paper: 3d-outdet-2024
          stage: first-pass
          anchor: section-04
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      mechanism:
        text: 3D-OutDet 先构造按距离排序的 kNN neighbor map，再用两层 NH Convolution 和一个残差块做逐点二分类；einsum 并行卷积。
