        text: 合成天气不能完全覆盖真实复杂性；SemanticSTF 稀有类别 IoU 可接近零，平均下游增益不能掩盖类别失败。 SnowRemovalNet
          同一BEV特征格内的点获得相同上下文；测试帧中 BEV 范围内点的 37.1%（CADC）/30.3%（WADS）存在异类且高度差≥.5m的同格邻点。稀疏树叶、建筑仍可能被删（Sec.5.2.2
