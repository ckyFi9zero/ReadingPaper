        status: source-checked
        evidence:
        - paper: triplemixer-2025
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
        - paper: snowremovalnet-2026
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      engineering_tricks:
        text: 体素均值下采样减规模，邻点差向量/attention/residual 保留局部关系；三方向投影减少单 BEV 的高度信息损失。它们不是三个天气专家。
          SnowRemovalNet：先在XYZ用k=16建图，下一层对64维特征的固定随机16维投影用k=12；FiLM缩放1+0.5*tanh(γ)限制在[0.5,1.5]以稳定训练；nearest
          grid_sample 从75×75网格取点特征。原文未分别消融这些补丁（Secs.4.4–4.5；Table1）。
