          CE、Lovász 与 wavelet regularization。 SnowRemovalNet 的双通道 BEV 经 DSConv 编码并采样到点；BEV_i/BEV_j与相对XYZ共同产生消息门控，max聚合后再用BEV预测FiLM缩放/偏移。点分支而非BEV网格直接输出逐点类别（Secs.4.3–4.6，pp.6–9）。
