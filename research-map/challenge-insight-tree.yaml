  insights:
  - id: insight-geometry
    name: 用对称聚合消除输入顺序影响
    techniques:
    - 排列不变性
    - 共享 MLP
    - max pooling
    - T-net
    - 领域外
    status: inferred
    transfer_boundary: 缺失、离群和高斯扰动继续增大时准确率下降；原论文的点集实验没有验证恶劣天气去噪迁移。
    source_papers:
    - pointnet-2017
    evidence:
    - paper: pointnet-2017
      stage: first-pass
      anchor: section-05
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    principle:
      text: 点的排列不应改变集合语义。共享逐点映射加对称聚合可以满足这一结构要求，但不会自动获得局部几何或天气鲁棒性。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: pointnet-2017
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    playbook:
      use_when:
        text: 输入是无序点集合，且希望直接进行集合分类或逐点预测时。
        basis: analyst-inference
        status: inferred
        evidence:
        - paper: pointnet-2017
          stage: first-pass
          anchor: section-04
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      mechanism:
        text: PointNet 对每点使用共享 MLP，再按通道 max pooling；分割把全局特征拼回逐点特征。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-2017
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      engineering_tricks:
        text: T-net 对齐输入/特征，高维特征变换加入正交正则以帮助优化；max pooling 与 average pooling 有比较，不能把所有辅件都视为同等必要。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-2017
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      assumptions_cost:
        text: 需要适当的点特征；全局聚合不显式建立局部邻域，特征变换增加优化负担。
        basis: analyst-inference
        status: inferred
        evidence:
