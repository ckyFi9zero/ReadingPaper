          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      engineering_tricks:
        text: 第一层可附加邻点距离并学习其权重；单残差块控制层数。kNN 构建要计入总耗时，不能只报告卷积部分。
