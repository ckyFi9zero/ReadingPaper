          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
        - paper: snowremovalnet-2026
          stage: first-pass
          anchor: section-05
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      assumptions_cost:
        text: 依赖逐点标签、投影分辨率和小波层数；参数量较高，资源受限部署需权衡。 SnowRemovalNet 需要同扫描XYZ/强度和±30m BEV，输入0.1m网格经编码后约0.8m一格；另需离线概率监督，不能把其35,925参数/RTX5080的17–59ms泛化为任何设备预算。
