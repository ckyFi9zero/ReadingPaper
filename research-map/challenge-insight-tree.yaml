        text: SDOR 用扇区密度与距离共同调节半径；PMDF 从粗滤雪样本拟合距离/高度分布并更新参数；RPS 的 DMROR 用估计 noise
          ratio 调节非线性半径。DeSnow-GNN 的图表示提供局部上下文，不能据此说它实现了前三者的显式密度校准。
          DTF以k近邻距离估密度，并以密度幂次调节阈值；距离MAD、曲率与原始强度共同组成空间异常分数。
