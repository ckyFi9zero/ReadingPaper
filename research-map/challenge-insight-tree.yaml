      evidence_scope:
        text: 原论文报告检测、分割或补全的对应结果；不能从整体收益推出“去噪越多越好”，也不能从单个定性例宣称稳定下游增益。 AWCR Table 1
          的 30/31 是真实晴天构造损失下的诊断特征恢复，不是自然雪检测或部署恢复率；Table 3 的 AWCR 控制恢复为 11/31 且新增 6
          个损失。自然天气候选追踪另显示 9 个 gained 目标由不足阈值的原几何经修正获得准确框；不能混同两种恢复机制。 SnowRemovalNet：支持论文指定分割/里程计设置下的平均收益，同时保留受损类别与结构反例；不是所有任务收益保证，也不证明哪一个去雪模块独立造成下游改善。
          Beyond the Snowflakes 的 WADS-3D 使用 KITTI 预训练模型直接推理，CADC 则以 50:50 划分并在过滤训练数据上微调，64线/32线传感器亦不同；两者不能构成只改变雪或传感器的控制实验，也不支持所有去雪方法普遍有用/无用。
