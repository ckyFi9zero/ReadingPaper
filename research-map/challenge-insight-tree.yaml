      mechanism:
        text: 匹配相似图像块并堆成矩阵；从带噪奇异值平方扣除估计噪声能量，再开方截零得到干净奇异值估计；以估计值倒数设权，使大奇异值惩罚小、小奇异值惩罚大。对块组做
