          stage: first-pass
          anchor: section-08
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      failure_boundary:
        text: 分类仍落后于 MVCNN；输入缺失、离群点及高斯扰动增大时准确率下降。高维特征变换增加优化难度。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-2017
          stage: first-pass
          anchor: section-08
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      evidence_scope:
        text: Sec. 4.2 给出对称聚合结构，Fig. 5 / Table 5 比较聚合和变换；ModelNet40 与部件分割是原任务证据。
        basis: analyst-inference
        status: inferred
        evidence:
        - paper: pointnet-2017
          stage: first-pass
          anchor: section-07
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
      reported_effect:
        text: pointnet-2017：ModelNet40 overall accuracy 89.2%，部件 mean IoU 83.7%；这些是点集识别实验，不是天气去噪验证（Tables
          1–2）。
        basis: note-summary
        status: source-checked
        evidence:
        - paper: pointnet-2017
          stage: first-pass
          anchor: section-07
          status: source-checked
          basis: existing-note
          original_pdf_review_status: source-checked
    source_locations:
