          88.92%、15 ms。CADC 逐点去雪为定性，检测另有 box 定量（Table III）。；triplemixer-2025：在去噪、语义分割、地点识别与检测上分别评估；真实
          SemanticSTF 的下游模型不重训，三模型平均 mIoU 提高 2.38 点（Tables VIII–X）。；shape-enhanced-set-det-2026：KITTI、Waymo
          上分别报告检测指标与补全指标，另比较不同距离、遮挡与效率（Sec. IV）。 AWCR（Tables 2–3，pp.7）：CoInfra natural
          adverse development 的 V2X-ViT Car BEV AP@0.7 25.70→30.37，作者报 +4.66（表值相减为
