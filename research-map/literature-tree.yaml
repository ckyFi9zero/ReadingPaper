  novelty_class: 1
  confidence: provisional
  first_work_status: not-assessed
  description: 既有 PointNet / PointNet++ 设定：无序三维点集（XYZ，可附颜色/法向量）；分类使用形状采样或场景预分割物体，分割使用单物体或场景子区域。
    训练/测试：以物体类别、部件或场景逐点标签进行任务监督；ModelNet40 归一化 1024 点，训练竖轴旋转与位置扰动；场景分割按块采样训练、测试覆盖全部点。 → 分类输出
    k 类分数；分割输出每点 m 类分数（n×m）。 本节点为限定集合的原生任务分类，不声明首创或领域覆盖完整。 新增 RMT-Seg 路线为整帧天气 LiDAR 经 range-view
    网络输出逐点语义，在 SemanticSTF 完整目标域标签监督下评测；不与形状分类或无监督去雪混同。
