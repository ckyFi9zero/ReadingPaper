    name: 竞争假设引导主动取证
    module_ids:
    - module-georeasoner-hypotheses
    - module-georeasoner-active-evidence
    motivation:
      text: 作者旨在减少局部似是而非证据造成的误定位与过早停止。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: georeasoner-2026
        stage: first-pass
        anchor: section-03
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: georeasoner-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 1. 拆分地理约束与待视觉核验的上下文关系，100m总览后形成最多6个区域并保存支持/未决关系。2. 结合访问效率按较低可信区域优先挑战假设；50m观察，SAM 3产生mask、MLLM按目标外观过滤、结合位姿定位、9m半径合并，初查最多9个候选而保留其余。3.
        对照完整指令与记忆排除显式矛盾，列出区分剩余候选的未决线索。4. 为细节下降/靠近，为上下文按空间关系选观察位置；多个补充航点以TSP组织，最多4次补观测。5. 将摘要、未决线索、支持/矛盾/修订状态写回记忆，精化位置与排序（Secs.3.2–3.3，Eqs.1–9）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: georeasoner-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: georeasoner-2026
        stage: first-pass
        anchor: section-06
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 先保留互相竞争的解释，再把仍欠缺的区分证据转成新的观测动作；地理先验缩小区域但不独自决定目标。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: georeasoner-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: georeasoner-2026
        stage: first-pass
        anchor: section-06
        status: source-checked
