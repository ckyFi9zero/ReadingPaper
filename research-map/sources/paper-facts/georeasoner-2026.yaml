    implementation:
      text: 1. 对领先候选由支持者举证、反对者查矛盾与替代解释，裁决者交叉核对指令、地理、视觉与历史，单轮辩论。2. 每个候选记录证据Ei及 supported/insufficient/conflict。3.
        有充分支持则导航至目标后stop；全部冲突则重规划；尚可获得信息则补观测；否则仅在不冲突候选中按既有评估投票回退。4. 最多额外重规划2次，预算耗尽仍全冲突则无已验证目标结束；回退停止不等于充分验证（Sec.3.4，Eqs.10–12）。
