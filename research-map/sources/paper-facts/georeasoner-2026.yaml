pipeline:
  id: pipeline-geospatial-active-reasoning
  name: 地理约束—主动取证—一致性验证
  description: 先将指令拆成目标g、地标L、上下文C、目标关系Sg和地标关系Sl；地理约束形成竞争区域；区域内生成并合并对象候选；按未决关系主动补观测，更新结构化证据记忆；三角色单轮验证产生支持/不足/冲突状态，分别驱动停止、补观测、重规划或明确未验证的预算回退（Secs.3.1–3.4，Eqs.1–12）。
