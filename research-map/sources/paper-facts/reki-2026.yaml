limitations:
- text: 原任务为语言条件机器人操作，未验证天气 LiDAR 迁移。主要采用 K=3 的短历史；长期事件依赖仍未测。训练窗口独立，而推理缓存可含窗口之前信息，二者不完全同构。整体基准的预训练数据、预算和架构不同，不把排行差异全部归因于记忆。RoboTwin
    同分布结果并非最好，真实机器人每任务只有 10 次测试且含部分任务积分；缓存不能挽救所有振荡失败。主文 Fig.6 的 21.8 ms 与附录 A.1 的 K=3 为 22.8 ms 属不同计时报告，不合并为同一运行（Secs.6–8、App.A.1/D.4/E）。
  evidence:
  - paper: reki-2026
    stage: first-pass
    anchor: section-08
