problem:
  failure_case: 作者指出多数 VLA 只据当前观测预测动作；直接堆历史图像增加 VLM 工作量，循环状态增加顺序训练约束。无记忆策略还可能在相似姿态之间跨动作块来回切换（Secs.1–2、6.2）。
  evidence:
  - paper: reki-2026
    stage: first-pass
    anchor: section-03
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
pipeline:
  id: pipeline-cacheable-vla-memory
  name: 逐帧 VLM 编码—动作专家 register 历史—缓存复用
  description: VLM 每帧仅编码当前图像与提示，动作专家每帧增加 32 个 register。register 读取当前 VLM context 和过去 registers，但不读取动作 token、跳过 adaptive
    normalization，因此不依赖去噪时间或机器人状态；动作 token 可读当前/过去 register 与本块动作。常规基准训练将 K=3、间隔 1 s 的窗口一次批处理（真实 UR5 配置的间隔为 2 s，Table 11），每帧各有动作损失；推理首个 Euler 步计算当前
    register KV，后九步复用，并跨 chunk 保留最近 K−1 帧 KV（Secs.4.1–4.2、Figs.3/9/10，pp.4–6、21–22）。
  evidence:
  - paper: reki-2026
    stage: first-pass
    anchor: module-register-memory
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
  - paper: reki-2026
    stage: first-pass
    anchor: module-cached-inference
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
