analysis:
  updated_at: '2026-11-03'
  previous_methods:
    text: 本文将历史帧输入 VLM、循环状态和独立记忆模块列为已有路线，并指出各自计算/顺序训练成本；这些比较来自本文叙述，不冒充本轮独立逐篇验证。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: reki-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 如果被缓存的表示依赖每次变化的动作或去噪时间，它就不能直接跨 Euler 步复用；将记忆更新与这些变量解耦，是本篇低增量成本的具体条件。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: reki-2026
      stage: first-pass
      anchor: module-register-memory
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: reki-2026
      stage: first-pass
      anchor: module-cached-inference
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 把历史压缩写入动作专家已有注意力中的少量、可缓存 token，让每帧编码一次，并通过当前和过去的观测区分相似姿态。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: reki-2026
      stage: first-pass
      anchor: insight-cacheable-memory
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-register-cache
    name: 可缓存的动作专家历史
    module_ids:
    - module-action-independent-register
    motivation:
      text: 在保留短历史的同时避免将过去图像重复交给 VLM。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: VLM 每帧仅编码当前图像与提示，动作专家每帧增加 32 个 register。register 读取当前 VLM context 和过去 registers，但不读取动作 token、跳过 adaptive
        normalization，因此不依赖去噪时间或机器人状态；动作 token 可读当前/过去 register 与本块动作。常规基准训练将 K=3、间隔 1 s 的窗口一次批处理（真实 UR5 配置的间隔为 2 s，Table 11），每帧各有动作损失；推理首个 Euler
        步计算当前 register KV，后九步复用，并跨 chunk 保留最近 K−1 帧 KV（Secs.4.1–4.2、Figs.3/9/10，pp.4–6、21–22）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: module-register-memory
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 不读取动作和跳过状态/flow-time 调制是缓存独立性的设计条件；整体性能收益仍需匹配对照，不由模型总榜证明。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: module-register-memory
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 同权重的有/无历史对照降低振荡比例，并在报告 H100 条件下增加较少时间/显存；不是所有平台上零成本。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: contribution-window-training
    name: 并行窗口与逐帧监督
    module_ids:
    - module-parallel-window-loss
    motivation:
      text: 避免历史状态必须逐帧顺序展开，并保留窗口内每帧的监督。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 窗口帧在 backbone 用 cu_seqlens 保持独立，动作专家按因果历史 register 支持组织可变长注意力；每帧平均动作损失，8 组 flow time/噪声共享 context/register。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: module-window-training
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 训练允许后帧损失向前帧 register 传播，但当前原文未用独立实验逐项分离逐帧监督、8-draw 或 attention packing 的性能收益。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: module-window-training
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 可在一次批处理内训练窗口；不把此结构说明升级成任意训练预算下的等成本结论。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reki-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
