      text: 同权重 3→3 与 3→1 更直接对应推理历史作用；3→2 在两项略高于 3→3，不能说历史越长必然越好。该 RoboTwin Clean 不是主榜 Clean+Rand 联合微调配置。
      basis: analyst-inference
