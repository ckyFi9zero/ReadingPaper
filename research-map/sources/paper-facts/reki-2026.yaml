task:
  name: 带短历史的语言条件机器人动作块生成
  input: 当前相机图像、语言/控制约定提示和机器人状态，加上历史帧的动作专家 register KV
  output: flow-matching 动作块，按当前 embodiment 的原生控制约定执行
  conditions: 2.4B REKI 使用公共机器人、第一视角人类与视觉语言数据预训练，然后按各基准/真实任务微调。默认 K=3、32 register/帧、10 个 Euler 步；真实 UR5+WSG50 五任务，50
    条训练示范/任务、10 次测试/任务，15 Hz 控制，Table 11 的记忆帧间隔为 2 s。
