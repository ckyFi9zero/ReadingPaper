limitations:
- text: 训练自由只适用于过滤与几何阶段，混合分类器仍需标签训练，规则参数亦用验证集网格搜索。作者将0.1m/10Hz工作范围限定为v≤1m/s，不覆盖典型更快步行；单机场16线JT16，雪为同传感器另采10000帧辅助集，不是跨硬件泛化。正文k=16与Table4最优30、验证集2000与2250、Eq.10排版和时间分数/EMA细节不完整；这些缺口未靠推测补齐。
