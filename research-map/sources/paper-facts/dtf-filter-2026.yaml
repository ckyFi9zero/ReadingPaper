      anchor: section-08
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 用有明确速度条件的持续性补足空间统计，并将不确定程度继续传到几何处理和检测；不把一条阈值当全场景真值。
    basis: analyst-inference
    status: inferred
