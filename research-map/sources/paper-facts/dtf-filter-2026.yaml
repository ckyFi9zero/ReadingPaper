task:
  name: 机场机坪低速/静止目标点云过滤与行人检测
  input: 16线JT16的连续LiDAR帧，坐标、强度与跨帧对应信息
  output: 过滤点及置信权重，后接地面/聚类和行人分类
  conditions: 仁川机场15000帧主集为晴/雾/雨，另10000帧雪辅助集使用相同传感器/安装和采集设置且不再微调。规则超参数网格搜索；检测分类器受监督训练。
