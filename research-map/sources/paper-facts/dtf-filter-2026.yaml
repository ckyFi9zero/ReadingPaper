pipeline:
  id: pipeline-statistical
  name: 统计规则过滤并传递连续置信度
  description: 空间分支计算近邻距离MAD robust-z、曲率、局部密度及原始强度异常，阈值随密度调整；时间分支把当前点映射到历史坐标，以M=5帧、0.1m近邻容差估计持续性。融合异常分数得到软权重，并传给加权地面拟合和聚类；最后由需训练的SVM/PointNet-lite等分类（Secs.3.2–3.4，pp.4–8）。
