      text: 正文Table1（PDF p.7）：雾/雨/雪FPD相对WeatherGen分别314.14→119.29、86.40→63.81、59.28→32.38；FMD为3.29→2.11、4.65→0.42、3.39→2.28。雨天JSD0.93与基线并列。Fig.3(a)少样本比较只展示雪天FMD的10/20/50/100%真实数据设置。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: result-weather
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 整体配置对照支持STF生成分布改善，但不分离RPWS、SiD与真实微调各自作用。MMD/JSD表头按×10^4/×10^1显示；跨指标不能相互当作精度，雨天JSD不是严格胜出。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: result-weather
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
