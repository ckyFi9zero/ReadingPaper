task:
  name: 天气条件下的单帧LiDAR扫描生成
  input: 推理时为目标天气标签、天气embedding bank与几何/强度高斯噪声；训练使用KITTI-360清晰扫描、STF天气统计及真实扫描微调。
  output: 包含几何结构与反射强度的新LiDAR扫描；不是对某一受损输入恢复晴天点云，也不输出语义伪标签。
  conditions: 正文Sec.4.1–4.2（PDF pp.6–7）：KITTI-360有76,715清晰扫描、64线Velodyne；STF约7,000雾/雨/雪扫描。先以RPWS增强数据训练，再用STF微调。文中写生成10,000清晰和200恶劣天气扫描，未在该句明确200是否每种天气；用分布指标评估，无下游检测/分割结果。
