analysis:
  updated_at: '2026-11-06'
  previous_methods:
    text: 作者将物理天气仿真与WeatherGen的仿真/联合扩散作为主要参照，认为前者难覆盖复杂统计，后者未显式区分几何与强度退化（Secs.1–2，PDF pp.1–2）。本轮只核对本篇对既有工作的描述。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: sid-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 整理者归纳：有限真实数据下，几何与辐射信号的退化差别使单一联合生成目标较难兼顾；作者采用非对称依赖作为归纳偏置。分数改善支持这一具体设计，但不能倒推所有基线失败均由几何主导造成。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: sid-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: sid-2026
      stage: first-pass
      anchor: result-direction
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 让几何成为强度生成的条件，而不要求强度反过来恢复几何；再用真实统计缩小训练增强与目标天气的分布差异。几何条件分解与RPWS统计移植是两个可分开追踪的机制，天气embedding沿用已有条件化卡。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: sid-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: sid-2026
      stage: first-pass
      anchor: module-rpws
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: sid-2026
      stage: first-pass
      anchor: module-sid
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-sid-rpws
    name: 真实天气统计驱动的训练增强
    module_ids:
    - module-sid-rpws
    motivation:
      text: 少量真实恶劣天气扫描不足以训练多样生成器，作者希望比简化物理/手工噪声更贴近真实几何与强度统计（Sec.3.2）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: module-rpws
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 随机采样清晰/天气扫描对，按距离bin计算有效回波计数比并乘空间可见性mask，Bernoulli保留清晰点；再以一维反射强度经验分布的optimal transport映射变换强度。无需同场景配准，也不增加可学习参数（Eqs.2–4，PDF
        pp.3–4）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: module-rpws
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 用真实扫描限制退化统计，分别控制点存活结构和强度分布；其作用是改善生成器训练数据，不是生成逐点真值或伪标签。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: module-rpws
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: sid-2026
        stage: first-pass
        anchor: result-ablation
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 正文组件对照支持改善部分几何/强度分布指标；单独换RPWS并非所有指标都更好，完整配置的收益不能全部归因于它。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: result-ablation
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: contribution-sid-factorization
    name: 结构先行的双分支扩散
    module_ids:
    - module-sid-factorization
    motivation:
      text: 作者认为强度受几何及上下文影响，而由退化强度反推几何不适定，因而采用S→I方向（Sec.3.3）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: module-sid
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 每步UNet_S预测结构噪声并得到S_hat_0，经E_S形成phi_S；UNet_I输入[I_t;S_t]，由phi_W+phi_S经AdaGN调制。强度损失对S_hat_0截断梯度；天气phi_W由模拟扫描编码并存bank，采样时按标签抽取（Fig.2、Eqs.7–14、Algorithm1，PDF
        pp.4–6）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: module-sid
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 比两个分支独立生成多一个结构约束，同时避免强度损失更新结构分支；估计的clean结构是去扩散噪声后的目标天气几何，不是恢复晴天。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: module-sid
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 雪天方向消融支持S→I在该模型/数据设置下优于Independent与I→S；不把此结果升级为普适因果定律或其他任务已验证迁移。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: result-direction
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: contribution-sid-fmd
    name: 天气域特征的生成分布评价
    module_ids:
    - module-sid-fmd
    motivation:
      text: 作者指出FPD/FRD所用晴天预训练特征面临天气域差异，提出补充评价FMD（正文Sec.4.1、补充Sec.C）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: Minkowski UNet在STF经SLidR图像到点云蒸馏训练；每帧汇总点/体素特征的均值与标准差，再在真实/生成扫描描述子上计算Fréchet均值与协方差距离（补充pp.2–3，Eq.5）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 在天气域特征空间比较二阶分布统计，补充晴天特征指标的视角；度量本身并不保证样本物理正确或任务可用。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: sid-2026
        stage: first-pass
        anchor: source-boundaries
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 提供同一评估流程下的补充排名；文中未报告独立人评或下游收益相关性验证，不将作者可靠性主张当作已证实标准。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: sid-2026
        stage: first-pass
        anchor: source-boundaries
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  experiments:
  - id: experiment-sid-weather
    name: 三类天气的生成分布
    kind: comparison
    assessment: reported
    contribution_ids:
    - contribution-sid-rpws
