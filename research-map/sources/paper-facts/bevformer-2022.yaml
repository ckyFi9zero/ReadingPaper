    implementation:
      text: 每个BEV网格沿高度放参考点，投影到相机；只在hit views中的参考点附近做deformable sampling，按命中视角聚合。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: bevformer-2022
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 几何投影先缩小可搜索区域，再让可学习局部偏移选择证据；不是对全部像素做同等搜索。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: bevformer-2022
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
