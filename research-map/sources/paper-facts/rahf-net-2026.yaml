task:
  name: LiDAR辅助的二维图像语义分割
  input: 同步RGB图像、LiDAR点云、相机内参与LiDAR到相机外参
  output: 相机图像平面的稠密语义标签，不是三维点标签或检测框
  conditions: KITTI-360主实验；DELIVER困难天气、光照和LiDAR jitter补充压力测试。SegFormer-B2与预训练Cylinder3D，四张RTX3090、每卡batch4；具体数据划分与预训练数据未明确。
