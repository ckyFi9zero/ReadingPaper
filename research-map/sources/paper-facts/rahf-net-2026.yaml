pipeline:
  id: pipeline-range-routed-2d-fusion
  name: 三维特征投影与距离分配的异质融合
  description: 先由预训练柱坐标编码器提取体素特征，投影非空体素中心到图像平面，同像素特征max pooling、空处零填充；原始点深度另以min pooling保留最近表面。深度归一化经sigmoid形成M，近场用LiDAR注意力重标定RGB并残差注入几何，远场用全局池化视觉上下文，最终M·Fnear+(1−M)·Ffar（Secs.3.3–3.5、Algorithm1，pp.4–6）。
  evidence:
  - paper: rahf-net-2026
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
