  technical_reason:
    text: 本文将区域信息是否可靠与区域分割是否困难分别建模；二者驱动不同计算路径。可靠性来自学习并受先验约束，不能与真实噪声标签或预测正确概率画等号。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: rmt-seg-2026
      stage: first-pass
      anchor: section-05
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 先分开评估“哪些输入应少影响全局上下文”和“哪些局部需要更多计算”，再分配全局传播与局部精炼的预算。该机制与单纯换用 Mamba 或增加 Transformer 不同，但其独立因果仍受消融配置限制。
    basis: analyst-inference
    status: inferred
