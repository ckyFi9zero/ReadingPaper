pipeline:
  id: pipeline-reliability-selective-segmentation
  name: 双评估引导全局传播与选择性局部精炼
  description: 将输入点云投影为保留 XYZ、径向距离及反射强度的 range view。共享评估网络预测可靠性 R 与难度 D；R 在 Mamba 之前混合原始特征与轻量变换 ψ(F0)，并非硬删点或直接修改状态转移。D
    对 P×P 窗口累加排序，仅取 top-K 的全局特征做局部 Transformer，再 scatter 回原位置，未选区置零；门控融合全局/局部特征并补入 R、D 的辅助特征，输出逐点语义（Secs.2.1–2.3，Eqs.1–4，pp.3–6）。
  evidence:
  - paper: rmt-seg-2026
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
