task:
  name: 恶劣天气 LiDAR 逐点语义分割
  input: 当前帧 LiDAR 点云的 XYZ、径向距离及反射强度，经球面投影进入 range-view 网络
  output: 逐点语义类别，不是雪/环境二分类或滤波后的清洁点云
  conditions: SemanticSTF 真实雪/轻雾/浓雾/雨；所有对比方法均在官方划分下使用完整目标域训练集及语义标签，UniMix 行为 CENet-based 实现。
