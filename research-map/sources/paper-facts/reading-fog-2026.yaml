  - id: contribution-fog-calibration
    name: 首检标签与经验验证
    module_ids:
    - module-fog-detection-calibration
    motivation:
      text: 作者希望把量程读出与可追踪的前车首检距离核对。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: reading-fog-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 按记录做留一交叉验证，以 β、3.912/β、log npts、log-linear fit R² 四特征拟合首检距离；每折仅在其他 13 条记录拟合，最终池化 488 帧误差（Sec.4.2/4.4、Table
        A1c）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: reading-fog-2026
        stage: first-pass
        anchor: result-regression
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 隔离同一记录的帧能避免记录内训练测试混用，但并不自动建立全新天气、目标或传感器的泛化证据。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reading-fog-2026
