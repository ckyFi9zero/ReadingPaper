        original_pdf_review_status: source-checked
    implementation:
      text: 上游雾/非雾分割后保留雾点子集，在 r∈[0.5,3] m 的近车窗口对 log I(r) 与 r 做普通最小二乘直线拟合，以负半斜率估计消光系数，再按原文 3.912/β 映射为量程。原文另用居中的
