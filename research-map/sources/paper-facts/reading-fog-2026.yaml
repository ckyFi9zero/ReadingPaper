task:
  name: 雾天逐帧 LiDAR 有效量程估计
  input: 带距离与强度的点云及既有雾/非雾分割结果；经验回归另需逐记录首检距离标签
  output: 物理核的消光系数与映射量程；可选四特征线性回归的目标首检距离
  conditions: 双车顶 905 nm、32 线 Velodyne VLP-32C 的重雾数据。标签以 PointPillars 置信阈值 0.5 首次检测到前车的帧为准，用同步 GNSS/车辆日志取距离；回归标签为记录基准距离加
    U(−0.5,+0.5) m 人工扰动（seed 42）。按 14 条记录留一，不能称逐帧随机划分或独立 488 次雾况实验。
  evidence:
  - paper: reading-fog-2026
    stage: first-pass
    anchor: section-02
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
  - paper: reading-fog-2026
    stage: first-pass
    anchor: result-regression
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
problem:
  failure_case: 作者认为去雾后的点云本身不能告诉规划器当前还能看到多远，且重雾下检测器可能漏检或把雾团检为目标；本文把原来丢弃的雾点作为量程观测，未以新的点级去噪网络为目标（Secs.1–2、5.3）。
  evidence:
  - paper: reading-fog-2026
    stage: first-pass
    anchor: section-03
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
pipeline:
  id: pipeline-fog-return-range
  name: 保留雾回波—估计光学量—区分物理量程与经验首检回归
  description: 上游雾/非雾分割后保留雾点子集，在 r∈[0.5,3] m 的近车窗口对 log I(r) 与 r 做普通最小二乘直线拟合，以负半斜率估计消光系数，再按原文 3.912/β 映射为量程。原文另用居中的
    ±5 帧中位数平滑，并可用 β、该映射值、log 点数和拟合 R² 四特征线性回归首检距离；后者有拟合参数，不能与物理核混同（Secs.3.1–3.4、4.4，PDF pp.6–8、10–11）。
  evidence:
  - paper: reading-fog-2026
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
