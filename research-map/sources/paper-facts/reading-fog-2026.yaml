    result:
      text: Table 1：STF 352 帧量程对照 r=0.72、RMSE 4.5 m，β 对照 r=0.78、RMSE 0.020 m⁻¹；Hahner 模拟 200 帧、四档 α，恢复斜率 0.886、R²=0.972；自身映射差≤0.1
