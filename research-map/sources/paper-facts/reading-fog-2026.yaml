      text: 双路输出保留了清洁云之外的信息；但该链路依赖上游分割和雾散射模型，预测值不等于可靠检测概率。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reading-fog-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 原任务提供可解释的逐帧量程读出，支持程度应按物理稳定性、经验回归和外部参照分开阅读。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reading-fog-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
