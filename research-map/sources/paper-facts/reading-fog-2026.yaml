    text: 同一次分割可服务两个目的：非雾点交给原任务，雾点保留为环境衰减观测。对首检距离的拟合另设监督与验证，不把拟合指标算给无参数物理核。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: reading-fog-2026
      stage: first-pass
      anchor: section-04
