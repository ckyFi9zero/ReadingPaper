limitations:
- text: 证据限于重雾：双车顶 VLP-32C、两条长参考记录，以及六场景的 14 条接近记录共 488 帧。轻雾、雨雪尘与更多交通场景未刻画；上游错分会减小样本或偏置斜率。STF 外部结果不证明所有厂商/波长通用。原文
    3.912 与 5% 对比阈值的等式不一致；居中 ±5 帧与在线等待时间、固定几何窗口与留出记录敏感性选择、正文/附录阶段计时亦未统一说明，不能静默消除。量程或回归区间不是已验证的检测可靠性/闭环安全保证（Sec.5.5，pp.15–16；Sec.3.3
    p.7；Tables 2/A1）。
  evidence:
