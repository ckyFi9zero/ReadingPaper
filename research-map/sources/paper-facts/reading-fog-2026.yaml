      text: 这些是有参数回归的池化指标。标签带人工 ±0.5 m 均匀扰动；0.25 m oracle MAE 是该扰动的参考，不是实际 GNSS 误差下界。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: reading-fog-2026
        stage: first-pass
