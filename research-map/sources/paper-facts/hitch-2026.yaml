pipeline:
  id: pipeline-measure-command-humanoid
  name: 测量调用—全身命令—轨迹教师学习
  description: VLM每轮发测量或执行调用；像素查询通过深度反投影为观测系3D位置，planner将身体分部命令变为全身参考，HEFT以50Hz跟踪；五任务同接口教师轨迹用于监督微调。
