      text: 像素坐标归一至[0,1000]并由深度反投影到每次观测重设的O系；planner以关节/速度/自碰撞约束求IK，HEFT跟踪并在教师planner参考上继续训练。教师只用自身量测与身体可达图；冻结视觉编码器、微调语言模型，损失仅作用教师响应。
