task:
  name: 语言指令驱动的人形机器人移动操作
  input: 指令、头部RGB图像、身体状态及交互历史；按需查询像素对应深度位置
  output: 骨盆、躯干、手掌、手指、行走及视线的全身命令
  conditions: Unitree G1，Qwen3.8-27B，五基础任务各500教师轨迹；SIMPLE六任务180 episodes、HumanoidArena四任务80 episodes。改相机/指令与45s/60s预算，不直接当官方榜单公平横比。
