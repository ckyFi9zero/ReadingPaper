limitations:
- text: 评测更换相机并改写指令，使用45s/60s模拟时长；部分模型选择SIMPLE成功率最高checkpoint。去感知配置重新训练，不是仅推理时遮挡。HA仅四任务，加入SIMPLE专用数据后HA成功率可下降；实机只搬箱13/20、导航6/10。平地planner不支持全部运动，行走后旧量测位置不可靠；没有天气感知或普遍机器人泛化证据。
