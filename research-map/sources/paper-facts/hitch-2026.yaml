analysis:
  updated_at: '2026-11-17'
  previous_methods:
    text: 作者区分端到端VLA的大量全身示范成本、只选技能的智能体接口和逐任务在线探索；强调接口之外仍要学习如何运用身体。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: hitch-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 长命令期间缺少高频决策纠偏，量测和执行偏差会累积；在老师与学生可见信息不一致时，模仿动作也不具备可解释的输入依据。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: hitch-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 把慢速语义决策与几何量测、准确身体执行分开，并让示范在相同信息和调用接口下产生；不把准确控制器等同于已学会任务决策。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: hitch-2026
      stage: first-pass
      anchor: section-05
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
