analysis:
  updated_at: '2026-10-31'
  previous_methods:
    text: 作者比较晴天深度补全器、天气专用方案及既有融合骨干；本篇将受损稀疏输入的补全与去噪联合处理，不声称此前从未考虑天气鲁棒性（Secs.1–2）。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: aurora-kitti-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 整理者归纳：输入退化、训练域差异与评测混合是不同层面，不能把天气重训练、教师监督和骨干结构的总收益统一归因于某个新模块。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: aurora-kitti-2026
      stage: first-pass
      anchor: section-07
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 训练时引入清洁视觉几何先验，同时把受损区域修复与干净区域保持分开衡量；新增信息与新增评测各承担不同作用。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: aurora-kitti-2026
      stage: first-pass
      anchor: section-05
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-clean-prior
    name: 训练期清洁视觉先验
    module_ids:
    - module-clean-prior-distillation
    motivation:
      text: 受损输入上的学生需要几何参考，但测试时不能依赖清洁输入。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: DDCD 以受天气退化的 RGB 与稀疏 LiDAR 投影深度作为学生输入。训练时从对应清洁 RGB 离线预计算冻结单目深度教师输出；以有效 GT 拟合尺度/偏置并使用 masked alignment，再由 scale-and-shift
        invariant 与梯度项传递结构先验，联合监督学生密集深度；教师与清洁 RGB 不进入测试输入（Sec.3.3–3.5，pp.7–10，Fig.5）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 离线教师产生额外训练约束，学生测试依赖当前受损两模态；这是结构性概括，不证明教师错误已被纠正。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 可用清洁图像先验训练学生而不增加推理教师，但训练数据和预计算成本仍在。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: contribution-region-evaluation
    name: 拆开修复与保持的评测
    module_ids:
    - module-region-restoration-metrics
    motivation:
      text: 整体 RMSE 无法同时说明受损点修复和干净区域保持。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 用配对清洁/退化 LiDAR 投影及相对容差 τ=0.05 划出受损与保留区域，再与有效 GT 掩码取交集。ERR 衡量受损区域 RMSE 相对受损输入的降低；DCE 与 CPP 分别为有效回波丢失区域/可靠回波保留区域的深度
        RMSE。CPP 不是保留点比例；ERR 不是二分类准确率，0 表示该区域 RMSE 与受损输入相同、未降低，负值表示误差扩大（Sec.3.6，Eqs.14–19，pp.9–10）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 配对掩码使不同区域的误差分别可见，但仍依赖投影、GT 与阈值。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 可识别总分相近但误差位置不同的配置；不自动证明哪类错误对检测最重要。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  experiments:
  - id: experiment-weather-training
    name: 同骨干天气训练与额外先验
    kind: comparison
    assessment: reported
    contribution_ids:
    - contribution-clean-prior
    result:
      text: Tables7–8：BP-Net 晴天预训练到天气重训练的 RMSE 为 4945.43→2103.33 mm；DDCD 为 1801.93 mm。DDCD 使用额外教师监督，不能视为只更换结构的同监督对照。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 天气重训练收益与清洁教师监督收益分开；报告值是本论文配置，不是复现实测或跨论文排行榜。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-normalization
    name: 清洁输入与 Norm 的消融边界
    kind: ablation
    assessment: reported
    contribution_ids:
    - contribution-clean-prior
    result:
      text: Table10：B（noisy + Norm）到 C（clean、无 Norm）同时改变教师输入与归一化；B 到完整 DDCD 在同 Norm 条件比较输入，C 到完整 DDCD 的 RMSE 改善但 iMAE 从1.64到1.96变差。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 不能把 B→C 当单独清洁输入效应，也不能把联合损失结果当 SSI/梯度独立贡献。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-region-metrics
    name: 区域指标揭示恢复与保持
    kind: design-choice
    assessment: reported
    contribution_ids:
    - contribution-region-evaluation
    result:
      text: Sec.3.6、Table3、Fig.8：ERR、DCE、CPP按异常回波/丢失/可靠保留区域分别计算。DDCD为0.826/474.41 mm/835.1 mm；UniK3D为0.744/683.03 mm/3136.4
        mm。BP-Net ERR=0.348，并非所有baseline均接近0；这些指标只用于配对AURORA。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 不同区域指标不能互换为逐点 precision/recall 或物理雪身份；GT掩码限制可见范围。 DDCD域内训练与其他zero-shot行不是同监督条件对照，分区差异不构成单模块因果。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-teacher-shift
    name: 教师选择的合成/真实差异
    kind: design-choice
    assessment: reported
    contribution_ids:
    - contribution-clean-prior
    result:
      text: 教师 V3 在 AURORA 的 RMSE 为1711.78 mm，对照教师为1801.93；DENSE 上为3950.11与2761.97 mm，排序反转（Table9，p.17）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 更强合成成绩不保证真实跨域更好；数据、教师与条件应保留，不能推出普适教师优劣。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: aurora-kitti-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
