task:
  name: 恶劣天气 RGB–LiDAR 深度补全与去噪
  input: 天气退化 RGB 与稀疏 LiDAR 投影；训练另需对应清洁 RGB、清洁深度监督及冻结单目教师
  output: 图像平面密集度量深度，不是全周点云逐点雪标签
  conditions: AURORA-KITTI 配对模拟雨/雪/雾与真实 DENSE 雨/雾跨域评测；训练监督与真实配对可用性不同。
