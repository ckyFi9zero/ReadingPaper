pipeline:
  id: pipeline-clean-prior-depth
  name: 训练时清洁视觉先验引导联合深度恢复
  description: DDCD 以受天气退化的 RGB 与稀疏 LiDAR 投影深度作为学生输入。训练时从对应清洁 RGB 离线预计算冻结单目深度教师输出；以有效 GT 拟合尺度/偏置并使用 masked alignment，再由 scale-and-shift
