problem:
  failure_case: 作者报告晴天训练的深度补全器在天气退化输入上明显退化；整体深度误差又将噪声区修复、缺失补全与原干净区保持混合，无法仅由总分区分三者（Secs.1、3.6、4，Tables4/8，Fig.8）。
