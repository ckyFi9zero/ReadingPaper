source_excerpt:
  problem: 二、Research Problem 作者表述 具体问题：在不同 LiDAR、不同降雪强度下自适应删除雪噪声。 （Abstract；Sec. I；PDF pp. 1–2） 作者表述
    场景：自动驾驶和路侧感知的雪天点云。 （Abstract；Sec. I；PDF pp. 1–2） 作者表述 重要性：固定或线性密度阈值难适配真实雪点的复杂分布。 （Abstract；Sec. I；PDF
    pp. 1–2） 作者表述 后果：误删目标结构或漏掉雪点，降低 3D 检测准确率。 （Abstract；Sec. I；PDF pp. 1–2）
  method: 五、Method：只看宏观逻辑 做了什么： 输入雪天 LiDAR 点云，并用物理先验做 coarse denoising。 为什么： 初始阶段需要从当前数据取得候选雪点，以缓解 cold
    start。 （Sec. III-A；Fig. 2；PDF pp. 4–5） 做了什么： 恢复被粗滤误删的目标点，形成用于建模的雪噪声样本。 为什么： 粗滤结果同时包含不确定噪声和非噪声，需要 target
    recovery 提高参数样本可靠性。 （Sec. III-A；Fig. 2；PDF pp. 4–5） 做了什么： 拟合距离 gamma 分布及高度 location-scale 分布。 为什么：
    作者认为雪噪声空间分布是非线性的，固定阈值不能跨场景。 （Sec. III-B–C；Figs. 3–4；PDF pp. 5–8） 做了什么： 体素化点云，以概率模型生成 search radius/密度阈值并过滤。
    为什么： 体素化降低 3D 邻域搜索成本，模型阈值替代数据集特定参数。 （Sec. III-D；Eqs. (7)–(9)；Algorithm 1；PDF pp. 8–10） 做了什么： 用历史窗口迭代更新参数，输出去雪点云。
    为什么： self-optimization 用于随当前雪强和传感器条件重新校准。 （Sec. III-D；Algorithm 1；PDF pp. 8–10） 原图裁剪：Fig. 2，PDF p.
    4。粗雪点提取、空间分布参数估计与精细过滤组成的 PMDF 流程；点击查看原尺寸。 概括 核心变化是先从当前/历史粗滤雪点拟合空间概率分布，再由该模型生成细滤参数并自迭代更新，而不是依赖离线固定阈值。
    （Sec. I；Sec. III；Fig. 2；Algorithm 1；PDF pp. 1–10）
  limitations: 八、Limitations 作者明确承认的 limitation 作者表述 作者明确指出：体素化提高效率，但会降低传感器近处、尤其树木等低密度目标的过滤精度；真实雪天数据收集和标注也很困难。
    （Sec. IV-B、IV-D；Fig. 8；PDF pp. 12, 15） 从实验结果中直接可见，但作者没有明确称为 limitation 的现象 直接观察 主过滤对比排除了 cold-start
    结果，报告的是 steady-state performance。 （Sec. IV-B；Table I 前后正文；PDF p. 11）
