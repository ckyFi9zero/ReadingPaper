    implementation:
      text: 训练前将PointRCNN的MLP/全连接宽度按0.7缩放并取实现兼容值；用训练集输入范围内有效点数中位数与各半径平均邻点数，计算带上下限和最小邻点数的固定点/邻居预算。SECOND缩减BEV/上采样通道并以离线点数统计设置体素预算。结构和预算训练、推理均不变，不按当前天气或每帧密度在线调节（Sec.3.3，Eqs.7–9，pp.4–5）。
      basis: note-summary
