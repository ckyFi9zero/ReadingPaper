    module_ids:
    - module-paired-sensitivity-order
    motivation:
      text: 原文以同场景清洁/受损差异衡量扰动影响，提出从低敏感度到高敏感度的训练进程。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: robust-efficient-lidar-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 七个固定预训练检测器分别融合清洁/受损预测；按类别以BEV IoU≥0.5贪心一对一匹配，把置信度绝对差、1−BEV IoU均值与0.5倍未匹配比例相加。分数同时赋给该清洁帧及其受损副本，将完整2N列表按低到高排序；每轮禁用shuffle，所有样本与损失权重不变（Sec.3.2，Eqs.2–6，PDF
        pp.3–4）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: robust-efficient-lidar-2026
        stage: first-pass
        anchor: module-score
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: robust-efficient-lidar-2026
        stage: first-pass
        anchor: module-order
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 配对参照将场景内容保持对应，把输入受损造成的预测变化用于排序；它仍可能包含检测器自身错误，不能视为真值难度。低到高排序收益不证明某一分数组件或固定每轮顺序独立必要。
      basis: analyst-inference
