analysis:
  updated_at: '2026-11-02'
  previous_methods:
    text: 按作者叙述，既有鲁棒训练多保留架构与工作量，轻量化多依赖清洁精度或通道/权重统计，未同时处理其定义的抗扰与资源目标。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: robust-efficient-lidar-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 训练时哪些例子先出现与推理时实际执行多少工作是不同杠杆；本篇把前者交给配对预测差异、后者交给离线配置。分数是预测变化而非真值难度或物理噪声强度。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: robust-efficient-lidar-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: robust-efficient-lidar-2026
      stage: first-pass
      anchor: section-05
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 把扰动影响与场景本身区分后安排全样本训练顺序，并在部署前用数据统计削减固定负载；不把训练期七模型成本带入在线推理。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: robust-efficient-lidar-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: robust-efficient-lidar-2026
