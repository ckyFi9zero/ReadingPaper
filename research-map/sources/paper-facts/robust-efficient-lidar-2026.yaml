task:
  name: 资源受限下抗合成扰动的三维目标检测
  input: 单帧LiDAR点云；训练另有清洁框标注、固定合成副本及七个预训练参考检测器
  output: 对象类别与三维框；部署为单个固定点式或体素式检测器
  conditions: KITTI 与 ONCE 的有框标注训练集；每个清洁帧生成并缓存一个受损版本，保留原框标签，清洁/受损为1:1。六种合成扰动（密度减少/增加、高斯坐标噪声、随机背景噪声、雨、雪）均为5级中的第4级；在对应混合受损验证集一次计算AP，不是六类天气分数的均值。
  evidence:
  - paper: robust-efficient-lidar-2026
    stage: first-pass
    anchor: section-02
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
  - paper: robust-efficient-lidar-2026
    stage: first-pass
    anchor: experiment-protocol
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
problem:
  failure_case: 作者指出鲁棒性训练通常不减少推理负载，而按清洁精度缩网络可能牺牲受损输入精度；部署需共同考虑清洁/受损AP、延迟和显存。该前作分类归于本文作者，不是对全领域的独立定论（Secs.1–2，pp.1–2）。
  evidence:
  - paper: robust-efficient-lidar-2026
    stage: first-pass
    anchor: section-03
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
pipeline:
  id: pipeline-offline-robust-provisioning
  name: 配对扰动排序与离线固定预算构建
  description: 七个固定预训练检测器分别融合清洁/受损预测；按类别以BEV IoU≥0.5贪心一对一匹配，把置信度绝对差、1−BEV IoU均值与0.5倍未匹配比例相加。分数同时赋给该清洁帧及其受损副本，将完整2N列表按低到高排序；每轮禁用shuffle，所有样本与损失权重不变（Sec.3.2，Eqs.2–6，PDF
    pp.3–4）。 训练前将PointRCNN的MLP/全连接宽度按0.7缩放并取实现兼容值；用训练集输入范围内有效点数中位数与各半径平均邻点数，计算带上下限和最小邻点数的固定点/邻居预算。SECOND缩减BEV/上采样通道并以离线点数统计设置体素预算。结构和预算训练、推理均不变，不按当前天气或每帧密度在线调节（Sec.3.3，Eqs.7–9，pp.4–5）。
  evidence:
  - paper: robust-efficient-lidar-2026
    stage: first-pass
    anchor: module-score
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
  - paper: robust-efficient-lidar-2026
    stage: first-pass
    anchor: module-order
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
  - paper: robust-efficient-lidar-2026
    stage: first-pass
    anchor: module-budget
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
