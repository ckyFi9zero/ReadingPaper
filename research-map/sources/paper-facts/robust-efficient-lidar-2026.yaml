    mechanism:
      text: 网络实际执行宽度与空间聚合预算一起减少；邻点越冗余允许越多削减，点数比越低则可降低共享点预算，但均受上下限保护。整体延迟收益不能拆归密度规则，未统一资源预算的对照也不证明该规则最优。
      basis: analyst-inference
