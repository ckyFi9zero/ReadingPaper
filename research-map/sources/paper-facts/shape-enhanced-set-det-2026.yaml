source_excerpt:
  problem: 2. Research Problem 具体问题与场景 作者表述 研究自动驾驶 LiDAR-based 3D object detection 中的遮挡场景。LiDAR 是 2.5D
    观测，无法看到目标背面；目标间重叠会阻断激光，且光度变化、特定反射角和远距离会导致信号中断（Sec. I）。 为什么重要 作者表述 3D 检测需要回归目标的 3D bounding box，完整形状信息缺失会降低检测性能，进而影响自动驾驶系统安全（Abstract,
    Sec. I）。 最终后果 作者表述 遮挡和稀疏点导致目标后部、边缘和结构轮廓缺失，检测器可能漏检、定位偏差或在远距离/小目标上性能下降（Sec. I, Fig. 1）。 作者的约束 作者表述 需要缓解不完整点云导致的性能下降，同时避免显著计算开销；补全模型应服务检测中的
    box regression，而非只追求独立 shape completion 的重建指标（Sec. I）。
  method: 5. Method：只看宏观逻辑 输入单帧 LiDAR 点云 → voxel/SPConv + BEV + RPN → CR / NMS 选高质量 RoI → aware pooling
    partial points → Transformer 编码 + 粗/稠密解码 → PointNet++ shape feature → HAF + box refinement Proposal
    generation（Sec. III-A）： 将点云体素化，经 3D sparse convolution、多尺度下采样和 BEV 2D CNN，用 RPN 预测 3D proposals；训练时
    CR 用预测 IoU 修正置信度，NMS 去冗余。 Segmentation auxiliary（Sec. III-B）： 训练阶段把多层 SPConv 特征插值到点坐标，预测 foreground/background，帮助低密度区域保留目标边界；推理时不启用。
    Partial-point extraction（Sec. III-C）： 在 proposal 内对有效体素做 aware pooling，得到固定数量 partial points，减少错误
    proposal 的背景干扰。 Transformer-based completion（Sec. III-C）： DGCNN 提取拓扑关系并加全局位置编码，Transformer self-attention
    建模长程依赖，KNN 分支补充局部几何；解码器先生成 coarse points，再生成 dense points，用两项 Chamfer loss 监督。 Hybrid Attention Fusion（Sec.
    III-D）： PointNet++ 从 dense points 提取 shape feature，与 RoI voxel spatial feature 拼接，用 point-wise/channel-wise
    attention 加权，送入检测头回归 box 和分类。 概括 相比已有检测器，真正变化的核心位置是 RoI refinement：额外建立“partial shape → complete shape
    → shape/spatial fusion”的路径；RPN、CR 和 SA 是围绕 proposal 质量与结构保持的辅助改动。 Tables VII–X，PDF p. 11，表格局部裁剪：Transformer
    配置、RoI 特征融合、补全点数和 GNN 补全方案的消融/对比结果。点击图片查看原尺寸。
  limitations: 8. Limitations 作者明确承认的 limitation 论文未明确说明 结论段主要强调效果、参数量和推理时间，没有单独列出失败条件或局限性清单。论文报告了距离增大时所有方法精度下降，但未将其正式命名为
    limitation。 从实验结果中直接可见、但作者没有明确称为 limitation 的现象 直接观察 Fig. 8 和 Sec. IV-C-4 表明随检测距离增加，car、pedestrian、cyclist
    的 AP 都下降；SET-Det 在各距离段保持相对优势，但绝对性能仍受稀疏点限制。 直接观察 Waymo L2（点更稀疏）比 L1 更具挑战，作者报告的优势在 L2 更明显；这显示方法依赖更强的补全来处理少点目标，但不是作者明确承认的失效边界。
    直接观察 EMD-Loss 与 CD-Loss 在 F-score/Fidelity/MMD 上接近，但 EMD 训练 memory 约高 2 倍、训练时长约高 27 倍（Sec. IV-G-2）。
