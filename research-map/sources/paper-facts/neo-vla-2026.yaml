pipeline:
  id: pipeline-native-visual-action-readout
  name: 原生视觉语言计算与可配置动作读出
  description: 两阶段stride32卷积把图像转成32×32区域token，与语言在40层2B backbone中共同演化。动作专家每层按映射读取某一backbone层的缓存KV，再与动作token的KV联合attention；不强制只读取最终视觉表示。first28、skip28、end28共享28层专家宽度，full40另属更深专家设置（Secs.3.1–3.4，pp.3–5）。
