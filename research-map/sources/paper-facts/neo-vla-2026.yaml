    status: source-checked
    evidence:
    - paper: neo-vla-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 语义理解终点和动作所需的局部几何可能并不一致；这是由本文设计与干预得到的有条件归纳。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: neo-vla-2026
      stage: first-pass
      anchor: result-layer-map
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 动作头所需信息不必集中在最后一层。把视觉读出层位作为显式设计变量，并分别核验冻结与全量微调时的映射；不能把中间特征接入本身当作通用收益保证。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: neo-vla-2026
      stage: first-pass
      anchor: result-layer-map
      status: source-checked
      basis: existing-note
