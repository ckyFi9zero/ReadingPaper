source_excerpt:
  problem: 二、Research Problem 作者表述 具体问题：从含车辆和行人的城市点云地图中构造静态地图。 （Abstract；Sec. I 前两段；PDF p. 1） 作者表述 场景：户外
    SLAM、先验地图定位、地图维护与更新。 （Abstract；Sec. I 前两段；PDF p. 1） 作者表述 重要性：静态结构是鲁棒定位和长期地图的基础。 （Abstract；Sec. I 前两段；PDF
    p. 1） 作者表述 后果：动态残留造成假结构，错误删除又损害地图完整性。 （Abstract；Sec. I 前两段；PDF p. 1）
  method: 五、Method：只看宏观逻辑 做了什么： 输入多帧配准后的 query scans 与含动态残影的原始地图。 为什么： 批处理可跨多个视角统计每个地图点的静态/动态证据。 （Sec.
    III-A–C；Fig. 2；PDF pp. 2–4） 做了什么： 把 query scan 与 map 投影为 range image，并按 visibility 计算 discrepancy。
    为什么： 二维 range image 使 scan-to-map 可见性比较高效。 （Sec. III-B；Fig. 3；PDF pp. 2–4） 做了什么： 累计 static/dynamic
    marks，先批量删除低 staticity score 点。 为什么： 作者优先彻底移除动态残影，即使暂时产生较多 FN。 （Sec. III-C；Eqs. (7)–(8)；Algorithm
    1；PDF p. 4） 做了什么： 逐轮降低 range-image 分辨率并 revert 被误删点。 为什么： 更粗分辨率提供更大的隐式关联窗口，用于容忍位姿误差并恢复静态点。 （Sec. III-D；Fig.
    4；Algorithm 1；PDF pp. 4–5） 做了什么： 输出静态地图，并可反向解析动态对象。 为什么： 静态地图既服务定位/地图维护，也能生成动态对象伪标签。 （Sec. IV-B–C；Figs.
    6–10；PDF pp. 6–8） 原图裁剪：Fig. 4，PDF p. 4。先 remove 再 revert 静态点的集合更新过程；点击查看原尺寸。 概括 核心变化是把一次性动态点删除改为 batch
    remove 后的 multiresolution revert，用逐级扩大关联范围来容忍 LiDAR motion ambiguity。 （Sec. I；Sec. III-C–D；Figs. 2、4；Algorithm
    1；PDF pp. 2–5）
  limitations: 八、Limitations 作者明确承认的 limitation 作者表述 作者明确指出：range image 的 visibility 只选最近点，因此可能看不到静态遮挡物后的动态点；Fig.
    11 的水泥隔离带造成漏删。 （Sec. IV-D；Fig. 11；PDF p. 8） 从实验结果中直接可见，但作者没有明确称为 limitation 的现象 直接观察 ‘优于人工标签’只由 Fig.
    6 的模糊区域定性展示支持，不能视为全序列总体定量优势。 （Sec. IV-B；Fig. 6；PDF p. 6）
