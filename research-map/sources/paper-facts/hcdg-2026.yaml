task:
  name: 统一多类别工业图像异常检测与定位
  input: 训练：多类别正常 2D 工业图像；测试：待检产品图像。冻结 DINOv2 的多层 patch tokens 为特征输入。
  output: 图像级异常分数和像素级异常热图，不是去噪后的图像或 LiDAR 点云。
  conditions: 只用正常样本训练统一模型；异常标注不作为训练监督，噪声注入提供 feature-space noise regression 目标，正常特征提供重建目标。评估限
    MVTec AD 与 VisA；具体 checkpoint 选取、训练/推理条件去噪差异仍待原文细查。
