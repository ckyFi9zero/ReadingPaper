pipeline:
  id: pipeline-native-hcdg-2026
  name: 用噪声预测误差抑制异常轻易重建
  description: 对冻结骨干的浅/深特征按样本加权融合；向特征注入噪声并训练预测器估计噪声，以位置相关预测误差调节条件去噪，再以跨注意力建立多层 encoder–decoder
    特征对应。最终组合重建误差与噪声预测误差产生异常分数。误差条件化抑制 trivial reconstruction 是作者解释，不能由最终指标倒推为独立证明。
