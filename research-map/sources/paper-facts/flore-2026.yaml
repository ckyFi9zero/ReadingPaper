analysis:
  updated_at: '2026-10-31'
  previous_methods:
    text: 作者以位置型无机器人示范策略、运动跟踪器及外接 admittance 控制作为对照；其问题是接触力未成为示范—策略—控制之间一致且实际执行的接口（Secs.I–II、IV）。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: flore-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 整理者归纳：运动参考有效不代表接触约束已满足，额外预测任务也不等于执行通道。需要区分观测力、预测力和控制器实际收到的命令。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: flore-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 把力作为贯穿示范、策略与控制的共享变量，并让测得接触误差闭合在参考生成器中；这两个设计杠杆在原任务分别记录。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: flore-2026
      stage: first-pass
      anchor: section-05
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-force-pathway
    name: 力作为可执行的学习接口
    module_ids:
    - module-force-command-pathway
    motivation:
      text: 仅跟踪姿态不能区分接触状态或产生所需作用力。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 高层扩散策略读取双腕图像、相对身体状态与测得 wrench 历史，预测关键点运动和力命令；低层以 p_target=p_reference+(f_cmd+I)/K 将力命令与测得力误差积分转为位置参考，再由单一 RL WBC
        产生关节位置目标。预测力实际送入控制器，与仅把力作为辅助监督不同（Secs.III-A/C，pp.3–5，Fig.2）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 力预测送入低层控制与仅学习力辅助目标作用不同；输入力与执行力也不能混为一谈。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 在接触丰富任务中可按阻力调整，范围受三个任务与单平台验证限制。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: contribution-force-reference
    name: 测得力驱动统一位置参考
    module_ids:
    - module-measured-force-reference
    motivation:
      text: 位置输出的 RL 跟踪器需要将作用力要求转成可追踪参考。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-04
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 统一参考生成器积分 f_cmd+f_meas，符号约定下理想反力等于 -f_cmd；接触门控 ch 使积分仅在接触建立、释放后清除，clip 限制 windup。目标偏移是 (f_cmd+I)/K，RL 策略观察 I、偏移与接触状态并保持为唯一关节目标执行器。未命令方向的测得外力也改变参考，使手在积分边界内顺应（Sec.III-A，Eq.1，pp.3–4）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 通过测量闭环修正位移参考，减少对接触刚度估计的依赖；积分有门控和限幅，不是无条件稳定性定理。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 同一执行策略协调力和运动，并可在未命令方向顺应；强度、方向和零点噪声范围仍有限。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  experiments:
  - id: experiment-force-pathways
    name: 同网络移除执行力通道
    kind: ablation
    assessment: reported
    contribution_ids:
    - contribution-force-pathway
    result:
      text: TableII（p.7）：完整24/30（80%），w/o F-cmd11/30（36.7%），w/o F-in20/30（66.7%），DP8/30（26.7%）。每任务10次且条件配对；w/o F-cmd 与完整策略是同一网络，执行时令
        f_cmd 及 ch/I/Δx 通道为0。作者仅对24/30与11/30报告 Fisher p=0.001（Sec.IV-F，p.8）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 执行力通道关闭包含关联控制状态，不是只拿掉一个独立网络层；F-in 属较小趋势，不能套用 F-cmd 的显著性。离线误差相同来自同网络，不说明执行效果相同。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-sim-force
    name: 仿真运动与力跟踪
    kind: comparison
    assessment: reported
    contribution_ids:
    - contribution-force-reference
    result:
      text: TableI（p.6）：Isaac Lab 训练、MuJoCo 测试；前向5–25 N命令的增益1.03–1.06，接触误差1.00–1.05 N，SONIC+admittance约0.67–0.70和7.9 N。统计仅包含两配对条件均未跌倒完成的片段；运动误差在
        f_cmd=0 条件计算。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 不是全轴或全部片段平均，成功片段筛选与运动/力条件必须保留。整体对照不能隔离积分、门控、奖励项各自因果。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-real-force
    name: 外置力计实机核对
    kind: design-choice
    assessment: reported
    contribution_ids:
    - contribution-force-reference
    result:
      text: Sec.IV-B（p.6）：外置刚性力计，4/6/8/10 N阶梯命令；x方向稳态约91%命令幅度，MAE约1.1 N，平均1.8 s进入±1 N范围，波动约±0.3–0.5 N。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 此为实机外部参考，不是仿真表格；x方向结果不能外推所有方向，侧向/向下较弱与跨轴泄漏仍被作者报告。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: flore-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
