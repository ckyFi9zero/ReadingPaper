source_excerpt:
  problem: 二、Research Problem 作者表述 具体问题：在雨雪雾中识别并删除 LiDAR 伪回波。 （Abstract；Sec. 1 前两段；PDF p. 1） 作者表述 场景：自动驾驶与机器人连续点云。
    （Abstract；Sec. 1 前两段；PDF p. 1） 作者表述 重要性：稀疏、不规则、近密远疏的点云不适合简单网格卷积。 （Abstract；Sec. 1 前两段；PDF p. 1） 作者表述
    后果：噪声会降低检测和跟踪能力。 （Abstract；Sec. 1 前两段；PDF p. 1）
  method: 五、Method：只看宏观逻辑 做了什么： 输入连续原始点云，并下采样为图顶点。 为什么： 降低直接在全部原始点上建图的规模。 （Sec. 3.1；Fig. 3；PDF pp. 3–4）
    做了什么： 基于空间邻接构图，并保存当前顶点用于下一帧。 为什么： 图结构适配非规则点云，邻接边表达局部几何关系。 （Sec. 3.1；Fig. 3；PDF pp. 3–4） 做了什么： temporal
    branch 配准前后帧并聚合差分；spatial branch 更新边和顶点。 为什么： 两条分支分别捕获运动后的时序变化和当前帧局部结构。 （Sec. 3.2；Fig. 3；PDF p. 4）
    做了什么： 融合两分支并预测顶点为噪声的概率。 为什么： 联合时空证据用于顶点分类。 （Sec. 3.2；Fig. 3；PDF p. 4） 做了什么： 将顶点预测映射回原始点并重建去噪点云。 为什么：
    输出需保持原始点云分辨率，而非只给下采样顶点。 （Sec. 3.3；Fig. 3；PDF p. 5） 原图裁剪：Fig. 3，PDF p. 3。图构造、顶点分类、时空融合与点云重建的完整 DeSnow-GNN
    框架；点击查看原尺寸。 概括 核心变化是以直接点云图替代 2D 投影，并在顶点分类中显式融合空间邻接与跨帧注册后的时序差分。 （Sec. 1；Sec. 3.1–3.3；Fig. 3；PDF pp.
    1–5）
  limitations: 八、Limitations 作者明确承认的 limitation 作者表述 作者明确指出 graph construction 对大规模点云仍计算密集；原始点到顶点的 O(M·N)
    映射造成运行劣势，因此实验把 N 限制为 5000、R 限制为 25。 （Sec. 4.7；Sec. 5；PDF p. 8） 从实验结果中直接可见，但作者没有明确称为 limitation 的现象
    直接观察 核心逐点定量表使用 WADS；CADC 以及雨/雾部分主要用于定性展示。 （Table 2；Figs. 5、7；PDF pp. 5–8）
