    original_pdf_review_status: source-checked
pipeline:
  id: pipeline-spectral-tta
  name: 局部谱分解驱动双流在线适应
  description: Sec.5.1–5.3（PDF pp.5–7）：预测框内居中点构建kNN图；归一化Laplacian图频域中，用局部支撑B-Spline分离两流。稳定流按不变分量保留比例选择原坐标点、产生检测框伪标签；特定流输入X+εXsp，对检测器和滤波端点联合优化一致性、稳定性及互补约束。不是逐点雪标签，也不是把重建Xin直接输入检测器。
  evidence:
  - paper: find-2026
    stage: first-pass
    anchor: fig3
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
