limitations:
- text: Sec.7（p.10）承认密度大变可能需手调参数。Table14（p.24）：移除10%预测框后Waymo→KITTI-C重度八类均值32.39，低于MOS32.62；仅有限扰动范围，不证明严重漏检仍可自纠。未验证真实雪点逐点去噪或沙尘。
  evidence:
  - paper: find-2026
    stage: first-pass
    anchor: table14
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
- text: 部署前使用源域谱统计初始化，在线阶段不访问源样本或标签；依赖预测框图和目标批次统计。Table5/10（pp.9,22）：RTX4090、batch8，194±18ms/点云、峰值11540MiB；谱处理27ms只是总时间的13.92%，不能当全方法延时。
  evidence:
