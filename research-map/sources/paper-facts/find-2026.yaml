  technical_reason:
    text: 跨频带混杂使简单低通未必保留语义；把稳定性当代理仍取决于对象图和目标统计是否可靠。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: find-2026
      stage: first-pass
      anchor: fig2
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 与其把单一频段永久视为噪声，可分别指定稳定分量的监督职责和特定分量的扰动职责，在目标流中联合适应。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: find-2026
      stage: first-pass
      anchor: fig3
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-dual-spectral
    name: 稳定性引导的双流频域适应
    module_ids:
    - module-find-spectral-selection
    - module-find-online-consistency
    motivation:
      text: Fig2显示跨谱域差异与窄带波动，促成局部频带建模。
