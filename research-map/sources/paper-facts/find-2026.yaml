problem:
  failure_case: Sec.4 Fig2（p.4）：不同频段均含跨域差异；刚性滤去低/中/高频都会破坏局部几何。CV与KL的相关是作者选择稳定性代理的依据，不是低频恒为语义的证明。
  evidence:
  - paper: find-2026
    stage: first-pass
    anchor: fig2
    status: source-checked
