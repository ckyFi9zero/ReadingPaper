      status: source-checked
      evidence:
      - paper: find-2026
        stage: first-pass
        anchor: fig2
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: Sec.5.1–5.3（PDF pp.5–7）：预测框内居中点构建kNN图；归一化Laplacian图频域中，用局部支撑B-Spline分离两流。稳定流按不变分量保留比例选择原坐标点、产生检测框伪标签；特定流输入X+εXsp，对检测器和滤波端点联合优化一致性、稳定性及互补约束。不是逐点雪标签，也不是把重建Xin直接输入检测器。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: find-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 稳定流提供相对可靠的检测伪标签，特定流提供域扰动；互补约束限制平凡解。机制解释是作者设计动机，不意味着所有保留点均为清洁点。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: find-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 允许窄带局部调整，不预设全部低频不变或全部高频为噪声；适用性仍受预测框及统计约束。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: find-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
