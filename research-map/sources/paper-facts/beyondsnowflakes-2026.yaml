    result:
      text: Sec.IV-A3 / Fig.4（p.4）：作者报告 WADS-3D 去雪平均 6.72% AP improvement；CADC gains
        negligible。两套数据的总体正向雪箱趋势去雪后仍在，CADC 与个别相邻 WADS 箱存在波动，不是严格单调。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-filter
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: fig-4
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 仅支持各自训练/传感器/数据条件下该 DSOR→LIOR 处理的结果。不是所有去雪器共同收益，也不能证明某个未量化阈值以上过滤必需。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-filter
        status: source-checked
