limitations:
- text: Sec. III-A/D–E、IV-C–E、V-B（PDF pp.2–7）：WADS-3D 只标 Car；WADS 使用 KITTI 预训练模型直接推理，CADC
    则以 50:50 划分并在去雪训练数据上微调，传感器也不同，因此不是只改变一个因素的跨数据集控制实验。RF/SHAP 解释元特征对 TP/FN 的预测，不是原检测器内部权重或物理因果干预。三种积雪机制在
    IV-E 作为假设提出；后续受控研究 [52] 仅被本文引用，本轮未独立核验该研究。滤波参数、RF 完整搜索空间、速度/计算成本和具体临界雪密度未在已读正文明确报告。
