      text: SHAP 为以元特征预测 TP/FN 的 RF 解释，不是五个检测器网络内部因果权重；Pearson 对分箱及平均元特征统计，不当成逐点独立样本。WADS
        雪强度文字称 <.03，但 Fig.7 为 .03–.04，不能静默统一。
