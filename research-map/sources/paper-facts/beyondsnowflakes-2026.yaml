analysis:
  updated_at: '2026-10-30'
  previous_methods:
    text: 作者指出粗天气分类、主要模拟空中雪而忽略表面积雪，以及合并异构传感器数据，会使天气效应与对象/传感器因素纠缠；这是作者对前人的概括，不据此宣布整个领域没有控制混杂（Sec.II-E，p.2）。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: beyondsnowflakes-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 整理者归纳：天气组间同时改变检测相关对象属性，跨组 AP 差异便不能单独归因于雪；过滤只改变输入中的一部分点，不能把其结果当作独立去除所有物理雪效应（Secs.III-E、IV-A–E）。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: beyondsnowflakes-2026
      stage: first-pass
      anchor: result-filter
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: beyondsnowflakes-2026
      stage: first-pass
      anchor: result-correlations
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 先把总分变化拆成具体错误，再检查影响该错误的对象属性是否与天气分组共变；将统计解释、滤波对照和物理机制假设分层记录。该归纳不是因果识别已完成。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: beyondsnowflakes-2026
      stage: first-pass
      anchor: result-recall
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: beyondsnowflakes-2026
      stage: first-pass
      anchor: result-meta
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
    - paper: beyondsnowflakes-2026
      stage: first-pass
      anchor: result-correlations
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-evaluation
    name: 独立基准与滤波对照
    module_ids:
    - module-beyondsnowflakes-benchmark
    motivation:
      text: 区分天气、传感器和对象因素，避免粗天气总分掩盖相反影响（Sec.II-E）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: section-03
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: WADS-3D 由 2050 个唯一原始 360° 扫描旋转得到 4100 个前视标注帧、30104 个 Car；CADC 7000 帧。以 DSOR→LIOR
        估计前视绝对雪点数，按分位数使各箱 GT Car 数量近似相当；五模型在各数据集内做原始/过滤对照（Secs.III-A–E，pp.2–4；Fig.3
        p.5）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: module-dataset
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: module-bins
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: module-ablation
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 原始/过滤同箱对照提供对滤波操作的比较，独立基准避免直接合并传感器；但不同数据集训练策略仍不同，不能隔离跨传感器因果。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: module-ablation
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 让去雪是否有收益与雪组总体趋势成为两个可分别检查的问题。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-filter
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: contribution-meta
    name: 以错误类型为入口的元信息分析
    module_ids:
    - module-beyondsnowflakes-meta
    motivation:
      text: 错误分解显示 AP 的总体改善主要来自 Recall，作者因此聚焦 TP/FN（Sec.IV-B3，p.5）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-recall
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 将 TP/FN 构成二分类目标；Tau 查单变量趋势、MI 查非线性依赖、网格搜索 RF 后用 conditional sampling SHAP
        处理相关特征外推问题。再计算主要对象元特征与雪箱的 Pearson r（Secs.III-E、IV-C–D，pp.3–6）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: module-meta
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 将某类检测失败映射到对象/场景属性，寻找与天气分组共同变化的统计因素；这是可检验的关联解释链，不等价于干预识别。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: module-meta
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-correlations
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 能发现天气强度特征在 TP/FN 代理分析中贡献较小，而目标点数等更突出，避免将 AP 的天气趋势直接解释为落雪有益。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-meta
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
