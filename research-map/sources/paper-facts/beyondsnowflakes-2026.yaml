    name: TP/FN 元特征与雪箱共同变化
    kind: comparison
    assessment: reported
    contribution_ids:
    - contribution-meta
    result:
      text: Figs.7–8（pp.6–7）：WADS 对象点数 SHAP 0.21–0.33、距离 0.15–0.25，CADC 点数 0.54–0.57、均值强度
        0.17–0.19。Table III（p.6）：雪箱与 WADS 对象点数 r=0.820,p=3.70e−3；与距离 r=−0.282,p=.430；CADC
        点数 r=.733,p=1.86e−3，强度 r=.694,p=4.12e−3。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: beyondsnowflakes-2026
        stage: first-pass
        anchor: result-meta
        status: source-checked
        basis: existing-note
