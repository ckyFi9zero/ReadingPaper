task:
  name: 雨退化LiDAR三维目标检测
  input: 训练：清洁/合成雨同场景点云及3D框标注；推理：雨天LiDAR sweeps
  output: 10类3D检测框、类别及姿态，不是逐点清洁/雨标签或恢复点坐标
  conditions: LISA模拟nuScenes的10/30 mm/h雨；10个LiDAR sweeps累积、32线配置、10类检测、24 epochs。clean、NRD-10、NRD-30分别训练测试，非晴天训练直接测雨。论文test指标为本地有标注划分而非官方隐藏测试服务器，完整划分ID未在正文说明。
  evidence:
  - paper: rasr-sasd3d-2026
    stage: first-pass
    anchor: section-02
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
  - paper: rasr-sasd3d-2026
    stage: first-pass
    anchor: section-07
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
problem:
  failure_case: 作者将雨天局部噪声、有效点缺失及区域退化差异视为结构损伤，认为统一恢复/均匀蒸馏难同时保护远距稀疏结构与处理近距噪声；这是论文问题表述，不是独立因果验证。
  evidence:
  - paper: rasr-sasd3d-2026
    stage: first-pass
    anchor: section-03
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
pipeline:
  id: pipeline-regional-weather-distillation
  name: 区域结构恢复与跨天气蒸馏检测
  description: PointPillars清洁教师预训练后冻结；学生在pillar/BEV潜在特征而非原始点坐标中恢复结构。RASR按距离先验与学习logits分配区域，经近/中/远不同深度子网和残差门控融合；SASD对有效BEV区域施加距离/不确定性权重、多尺度特征、关系矩阵与全局结构蒸馏。推理保留学生与检测头。
  evidence:
  - paper: rasr-sasd3d-2026
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
