      text: TableIII/Sec.V（p.5）：3D框内物体射线的Object标签进入Top-3最强峰比例，Easy/Moderate/Hard为87.1%/65.8%/34.9%；Hard的Top-1/2为11.6%/25.5%。这是候选峰覆盖率，不是恢复算法精度、检测召回率或AP。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: fog-fwl-2026
