analysis:
  updated_at: '2026-11-16'
  previous_methods:
    text: 作者将峰后点云/多回波处理与峰前全波形区分：只有幸存峰的输入不含所有弱物体回波。对前人不足的概括属于论文论述，未独立穷尽检索。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: fog-fwl-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 当对象回波在峰排序阶段被截断，下游删除错误点不能找回这项已丢失的观测；保留波形只避免该级截断，不保证信噪比足以恢复。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: fog-fwl-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 先检查任务信息是否在传感器输出阶段消失，再选择恢复输入表示；输入覆盖诊断和恢复效果评测应分开。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: fog-fwl-2026
      stage: first-pass
      anchor: table3
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-waveform-data
    name: 同格式Real/Sim数据与参考标签协议
    module_ids:
    - module-fog-waveform-reference
    - module-fog-waveform-simulator
    motivation:
      text: 需要真实雾波形、细粒度回波标签、下游框和可分层难度，来评价弱对象反射恢复。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: fog-fwl-2026
        stage: first-pass
        anchor: section-03
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: Sec.III-E（p.3）：同场景同配置约100帧无雾波形求和，参考最大峰kref给出表面位置；雾帧在±2 bins（±0.30m）内取最近峰，无峰则仍标kref。天空用参考波形的时间集中度排除。Object包括地面、墙、建筑，并非车辆类别；这建立参考监督，不表示雾帧中物体回波一定可辨。
        CARLA八城每城1500视点生成12000帧；异质羽流消光场、时间分辨体散射渲染及发射脉冲卷积，再以SPAD饱和/死时间/保持输出建模光子计数；同传感器400×512×700格式的Real仅评价、Sim用于训练。该协议允许严格sim-to-real评测，v1未报告方法迁移成绩（Secs.III–IV，pp.2–5）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: fog-fwl-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 清洁参考固定对象表面身份，而原始波形保留峰排序之外的信号；异质介质与接收器响应共同控制输入分布。这是设计解释，不是模块独立因果验证。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: fog-fwl-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 可分别诊断候选峰损失和安排不使用真实训练波形的评价；尚不能据此声称仿真已消除域差异。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: fog-fwl-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
