task:
  name: 雾天全波形恢复与下游检测的数据基础
  input: 峰值检测前SPAD光子计数波形及同配置无雾参考；仿真场景与接收器模型
  output: Real评价集、Sim训练集、Object/Fog/Noise时间bin标签、3D框及衰减难度等级，不是恢复算法
  conditions: 人工局部雾波形及峰值丢失分析直接关联天气LiDAR感知；属于主线领域内而非仅因未提出去噪网络归领域外。Real不用于训练，v1尚无恢复/检测算法基准。
