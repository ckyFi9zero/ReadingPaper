task:
  name: 非局部自相似图像块的低秩估计与加性白高斯噪声图像去噪
  input: 带噪自然图像 y=x+n 与噪声水平 σn；局部搜索窗口内匹配的相似块堆叠为观测矩阵 Yj。
  output: 各块组干净低秩矩阵估计，经重叠块聚合得到整幅干净图像估计。
  conditions: 非训练型优化方法，不需监督训练集；用干净测试图合成零均值加性白高斯噪声并以真值计算 PSNR。需噪声水平用于保真项与奇异值估计，需块组有非局部自相似/低秩性。正文评测
    20 幅图、σn=10/30/50/100。
