pipeline:
  id: pipeline-native-wnnm-2014
  name: 对主要奇异值少收缩
  description: 匹配相似图像块并堆成矩阵；从带噪奇异值平方扣除估计噪声能量，再开方截零得到干净奇异值估计；以估计值倒数设权，使大奇异值惩罚小、小奇异值惩罚大。对块组做
    SVD 和加权软阈值后重建、聚合图像，外层迭代正则化并重复。去噪采用非减权重，CVPR 本文 Corollary 1 将一步块组计算表述为解析固定点，不应笼统改写为任意权重全局最优。
  evidence:
  - paper: wnnm-2014
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
