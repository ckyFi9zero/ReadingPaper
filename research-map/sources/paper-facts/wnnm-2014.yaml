        工程细节：估计式截零以避免负的能量估计，权重分母加 ε=10^-16 避免除零；匹配限定在足够大的局部窗口；δ=0.1、c=2.8。σn≤20、20<σn≤40、40<σn≤60、σn>60
        时，块宽为 6/7/8/9，外层轮数 K=8/12/14/14。单块固定权重的一步收缩不等于整图只运行一轮。
