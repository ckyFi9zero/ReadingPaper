source_excerpt:
  problem: 二、Research Problem 具体问题 作者表述 如何从度量空间中的点集学习语义函数，既捕获局部结构，又处理不同区域的非均匀采样密度。（Sec. 1–2） 发生场景 作者表述
    三维扫描器、配备扫描设备的自动驾驶车辆等得到的几何点集；密度变化可能来自透视、径向变化和运动。任务输出可为整个点集的类别，也可为每个点的标签。（Sec. 1，第1段；Sec. 2） 为何重要 作者表述
    局部结构对识别细粒度模式和理解复杂场景很重要；从小感受野到大感受野的层次抽象，是作者从 CNN 中借鉴的原则。（Sec. 1，第2–3段） 直接后果 作者表述 密集数据上学习的局部特征可能不能泛化到稀疏区域；只针对稀疏点云训练又可能认不出细粒度局部结构。（Sec.
    3.3，PDF p.4）
  method: 五、Method：只看宏观逻辑 PointNet++ Fig. 2，正文PDF p.3。原图及图注裁剪：层次set abstraction，以及分类和分割输出。图中展示单尺度分组。 点击可按原尺寸查看。
    下面是 概括示意 ，依据 Sec. 3.2–3.4 与 Figs. 2–3。 Input：坐标 + 可选特征 + 距离度量 。输入 N 个点及其特征，用距离定义局部邻域；一般三维任务使用欧氏空间。（Sec.
    2、3.2） Sampling 。使用 farthest point sampling（FPS）选局部区域中心，作者认为同数量中心下比随机采样更好覆盖输入点集。（Sec. 3.2，Sampling
    layer） Grouping → 局部 PointNet 。围绕中心用 ball query 分组，把坐标换成相对中心的局部坐标，用 mini-PointNet 把每个邻域编码为固定长度特征；其目的是表示局部点间关系。（Sec.
    3.2） 递归 set abstraction 。重复采样、分组和局部编码，产生更少的代表点与更大上下文的特征，直至形成整体表示。（Sec. 3.2） 密度适应的两个可选设计 。MSG 在同一中心使用多个尺度，各尺度独立提特征后拼接；MRG
    拼接较低层子区域汇聚的特征和直接由当前区域原始点计算的特征，以降低大邻域重复计算。作者用 random input dropout 让训练覆盖多种稀疏度。（Sec. 3.3） Output 。分类用全局特征预测类别；分割用距离加权插值、跨层
    skip links 和逐点更新层，把下采样后的特征逐级传播回原始点集。（Sec. 3.4；Fig. 2） PointNet++ Fig. 3，正文PDF p.4。原图及图注裁剪：(a) MSG；(b)
    MRG。 点击可按原尺寸查看。 概括 与本文所述 PointNet 的核心差别在于： 把一次整体聚合改成度量驱动的局部分组与递归聚合，并进一步组合多个尺度的信息 。MSG 和 MRG 是替代设计，不是每个网络必须依次通过的两个步骤。（Sec.
    3.1–3.3）
  limitations: 八、Limitations 作者明确承认的问题 作者表述 MSG 在每个中心的大尺度邻域重复运行局部 PointNet，尤其底层中心多时，计算代价高；MRG 是为减少这部分开销提出的折中。（Sec.
    3.3，PDF p.5） 作者表述 补充材料明确指出 MSG 约为 SSG 的2倍计算时间；结论仍提出应进一步加速 MSG / MRG。（补充 C.4；正文 Sec. 6） 作者表述 均匀点加随机
    dropout 的训练数据，与虚拟非均匀扫描之间仍存在 domain gap。（Sec. 4.2，PDF p.7） 实验直接可见、作者未明确称为 limitation 的现象 直接观察 MSG+DP
    在 ScanNet 密度偏移时仍从84.5%降到80.4%，没有完全消除性能下降；MRG+DP也从83.4%降到76.2%。（Fig. 5） 直接观察 补充 Table 4 的前向时间为：PointNet
    25.3 ms、SSG 82.4 ms、MSG 163.2 ms、MRG 87.0 ms；这是 batch size 8 的前向测量设置 ，不改写成单物体延迟，也不能据此称本文速度全面优于 PointNet。（补充
    C.4，p.4） 直接观察 MNIST 0.51%的错误率高于 NiN 的0.47%；ShapeNet part 的85.1%总体均值也不表示各类别都最好。（正文 Table 1；补充 Table
    1） PointNet++ 补充Table 4，补充PDF p.4。原表及表注裁剪：模型大小与batch size 8设置下的前向时间。 点击可按原尺寸查看。
