novelty_assessment:
  novelty_class: 4
  confidence: provisional
  reason: 仅按固定检测器上的输入过滤/候选修复作增量方法登记；作者 controlled-study 首次性主张未独立检索，不判定 seminal work 或领域空白。
limitations:
- text: 原文 Sec. 5.1–5.4（PDF pp. 6–7）：真实输入来自 CoInfra 两个固定路侧节点对，结果是 development 数据；自然天气行共用双源点与固定背景图 support
    filter，控制行不使用该过滤。控制干预是晴天真实输入上的构造 exterior loss，不是自然配对雪天观测；特征恢复需原输入特征，属于诊断而非部署模块。真实修复只改变 Car 输出且集中计算双源点统计；未验证跨传感器泛化或所有真实天气因果机制。
  evidence:
