analysis:
  updated_at: '2026-11-13'
  previous_methods:
    text: 作者区分天气鲁棒融合/去噪与受控上下文诊断：单次漏检不能区分物体测量改变与外部环境改变；prior-work描述仅为本文作者概括（v2 Secs.1–2，PDF pp.1–3）。
    basis: note-summary
    status: source-checked
    evidence:
    - paper: awcr-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 阅读者归纳：保留物体点不保证邻域表示稳定。v2以完整320视图的71/72物体区域恢复和三个0/72等面积外部对照定位表示路径；外部对照距离相近但占据率/替换幅度不同，不能宣称消除了全部控制混杂（Sec.3.2、Table1、附录B.3/TableS3）。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: awcr-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 把“点是否保留”与“任务如何解释这些点”分开，并联合检查修复收益及原有正确检测/协同帮助的保留。此处是整理者归纳，不是跨天气因果定律。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: awcr-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
  - id: contribution-repair
    name: 按监督条件分别进行输入过滤或候选修复
    module_ids:
    - module-awcr-point-classifier
    - module-awcr-local-correction
    - module-awcr-quality-selection
    motivation:
      text: v2 Sec.3.3：64视图晴天修复集的31个诱导漏检中，19个仍有预算内准确候选，12个完整原候选池也没有；因此同时考虑重新选择与有界几何修正，并用权重控制新候选损害原检测的风险。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 模拟 V2X-R 的 Point Classifier 以生成点身份训练，在固定检测器前过滤 peer 点；候选修复保留原框、增加有界修正，再用双源当前点统计与校准权重 λ 联合选择。原特征替换仅诊断，推理不需要原始配对参考（v2
        Secs.3–4，PDF pp.3–6）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 阅读者归纳：把候选是否存在、是否定位准确、是否通过分数/NMS分开；λ既改变候选入池优先级，也插值原框质量分数并缩放修正框分数。不能把整个端点差异归给几何变化；固定分数几何回退才支持部分近阈值目标的定位解释（Secs.4.3、5.3、B.8）。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 训练不要求自然配对clear/adverse录制，但CoInfra构造监督仍使用标注和晴天观测。默认权重在repair-training内部60/12/24个物理时刻的fit/buffer/validation划分选择；不是在development上择优（Sec.4.4、A.6）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  experiments:
  - id: experiment-intervention
    name: 控制外部移除及特征恢复
    kind: design-choice
    assessment: reported
    contribution_ids: []
    result:
      text: v2 Table1（PDF p.4）：全320-view/80-time CoInfra诊断326原正确中方向性删除损失72，等数量随机损失10–18；物体邻域恢复71/72，无新增稳定损失0/254，三个等面积外部区域各0/72。模拟仍为7/8物体恢复、4/8外部恢复。晴天64-view修复子集的30/31保留在TableS4，不与全量71/72混用。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 原始同场景特征恢复是诊断上界式干预，不是AWCR部署恢复率；公共三录制中方向性删除并非始终比随机更差。TablesS3–S4明确外部控制与子集条件。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-detection
    name: 固定候选预算下的检测表现
    kind: comparison
    assessment: reported
    contribution_ids:
    - contribution-repair
    result:
      text: v2 Tables2–3（PDF p.7）、Sec.5.2：CoInfra V2X-ViT默认λ=0.7三fit Car AP70均值29.92±0.34，对Original25.70为+4.22点；固定fit29.95另列。HEAL全V2X-Radar-C验证922输入67.53→68.22±0.04；独立DAIR/V2X-Seq雨录制32.86→37.86±0.97。不能沿用v1满权重固定fit30.37当默认均值。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 本文SOTA表述限LiDAR-only V2X-Radar-C验证与作者列出的比较；不同数据不拼排行榜。公共V2X-DGW global-confidence-ranking增益与原frame-order evaluator下降2.79/3.98/3.65点（雾/雨/雪）必须同时保留（Sec.5.2、E.3）。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-retention
    name: 候选追踪、修复及原有收益保留
    kind: ablation
    assessment: reported
    contribution_ids:
    - contribution-repair
    result:
      text: v2 Table3（PDF p.7）、TablesS7/S9/S11/S16（PDF pp.16–17、19、22）：默认λ=0.7三fit受控恢复8/6/8，新损失1/1/2，剩余错误均值25；去掉点统计恢复均值仍7.33但新损失1.33→4.33。自然天气默认对AWCR0新增正确14/15/13、损失6/6/8，其中需新几何为4/2/2；固定最终分数回退几何后这些近阈值恢复消失。默认自然保留225.33/230（fit均值），false均值290.33；满权重端点11恢复/6新损失不是默认结果。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 受控救回目标原池都有准确候选，不能称为新几何救回；自然输入仅指定近阈值目标通过完整原池检查和固定分数回退支持几何作用。总AP提升与原正确/false代价分别报告，不把整个配置收益归于每个模块。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  boundary:
    text: v2 Sec.5、附录A–C：CoInfra仍是development而非全新独立测试，人工外部删除不是完整自然天气过程；全320视图机制诊断与64视图晴天修复子集不同。自然CoInfra行共享双源当前点和背景图support
      filter，控制行不使用。修复需要标注、固定检测器及集中点统计；跨数据集的训练/公共权重并非零样本跨硬件保证。默认λ=0.7仍损失部分原正确检测；V2X-DGW同预测在frame-order评价下低于Original，不能仅报global-ranking正增益（Sec.5.2、E.3/TableS21，PDF p.24）。
    basis: note-summary
