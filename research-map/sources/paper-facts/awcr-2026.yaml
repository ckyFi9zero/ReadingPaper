    original_pdf_review_status: source-checked
- id: module-awcr-local-correction
  name: Local Correction
  role: candidate-refinement
  motivation: 在保留原候选的同时，为定位不足的候选提供有界几何与分数调整。
  evidence:
  - paper: awcr-2026
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
- id: module-awcr-quality-selection
  name: Quality Selection
  role: candidate-selection
  motivation: 用当前双源点统计判断候选定位质量，而不只依赖原生置信度。
  evidence:
