problem:
  failure_case: 作者在固定检测器上保留所有标注物体内部 detector-retained points，仅移除外部点，仍观察到先前正确的协同目标漏检；目标点保留不保证其编码和协同帮助不变（Sec.
    3.2–3.4，pp. 3–4）。
