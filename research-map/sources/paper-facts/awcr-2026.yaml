analysis:
  updated_at: '2026-10-30'
  previous_methods:
    text: 作者区分天气鲁棒融合/去噪与本篇目标级诊断：aggregate scores 未单独说明哪些既有协同帮助消失及原因；这不是断言前人未研究上下文（Secs. 1–2，pp. 1–3）。
    basis: note-summary
