pipeline:
  id: pipeline-cooperative-repair
  name: 固定检测器的输入过滤或候选修复
  description: 两种分别训练的实现：模拟数据 Point Classifier 过滤 peer 新增天气点后送固定检测器；真实数据 Local Correction 产生有界候选，Quality
    Selection 用双源当前量测支持选择。诊断特征替换不属于推理流水线（Sec. 4，pp. 4–6）。
  evidence:
  - paper: awcr-2026
    stage: first-pass
    anchor: section-05
    status: source-checked
    basis: existing-note
    original_pdf_review_status: source-checked
modules:
- id: module-awcr-point-classifier
  name: Point Classifier
  role: input-filter
  motivation: 利用模拟生成的天气点身份监督，在编码前过滤新增回波；不是恢复外部缺失点。
