pipeline:
  id: pipeline-cooperative-repair
  name: 固定检测器的输入过滤或候选修复
  description: 模拟 V2X-R 的 Point Classifier 以生成点身份训练，在固定检测器前过滤 peer 点；候选修复保留原框、增加有界修正，再用双源当前点统计与校准权重 λ 联合选择。原特征替换仅诊断，推理不需要原始配对参考（v2
    Secs.3–4，PDF pp.3–6）。
