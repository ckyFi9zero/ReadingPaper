        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    implementation:
      text: 两种分别训练的实现：模拟数据 Point Classifier 过滤 peer 新增天气点后送固定检测器；真实数据 Local Correction 产生有界候选，Quality
        Selection 用双源当前量测支持选择。诊断特征替换不属于推理流水线（Sec. 4，pp. 4–6）。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    mechanism:
      text: 模拟分支以生成身份训练分类器，推理仅据当前 peer 点特征识别天气点；真实分支将有界候选改动与当前量测质量评估分开。两分支的训练信号和作用对象不同，不能当作单一去雪网络。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    advantage:
      text: 真实分支不要求自然配对 clear/adverse recordings，但仍需已有标注、晴天输入和人工 loss variants；不能解释为无监督或无清洁数据。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-05
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  experiments:
  - id: experiment-intervention
    name: 控制外部移除及特征恢复
    kind: design-choice
    assessment: reported
    contribution_ids: []
    result:
      text: Table 1（p.4）：V2X-ViT 模拟 216 个原正确观察中方向移除损失 8 个，三随机种子等数量对照损失 2–4；真实晴天构造输入 150 个中损失 31 个，随机对照
        5–10。物体邻域前融合原特征恢复 7/8 与 30/31；真实三种等面积外部掩码各 0/31，原稳定观察均无新增损失。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 该诊断替换依赖原始输入特征，不能等同 AWCR 在线可恢复 30/31；控制移除不是自然雪过程的完整模型，三外部对照只对应真实实验设置。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-detection
    name: 固定候选预算下的检测表现
    kind: comparison
    assessment: reported
    contribution_ids:
    - contribution-repair
    result:
      text: Table 2（p.7）及 Sec.5.2（p.6）：CoInfra natural adverse development 上 V2X-ViT Car BEV AP@0.7 从
        25.70 到 30.37（作者报 +4.66，表值相减为 4.67；原文未提供未舍入值）；AttFuse 10.55 到 16.11（+5.56）。模拟 fog vehicle AP@0.7 从 22.94
        到 27.41（+4.47），预算 4096。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 报告值不是复现；真实 car 与模拟 vehicle 属不同数据/设定，不形成跨论文排行榜。真实自然行使用共享 support filter；AWCR 只修改 Car。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
  - id: experiment-retention
    name: 候选追踪、修复及原有收益保留
    kind: ablation
    assessment: reported
    contribution_ids:
    - contribution-repair
    result:
      text: Table 3 与 Secs.5.3–5.4（pp.6–7）：计数采用 score > 0.27、BEV IoU ≥ 0.7；controlled rescue 要求原始与改变后两个输入均正确，new losses 指原稳定的 119 个观察中任一输入失败。真实自然天气正确/错误检测 230/447→251/335，保留原正确 220/230、原协同帮助 131/140。控制输入
        AWCR 恢复 11/31，另增 6 个损失，总错误 31→26；这些 11 次恢复原预算候选池已有准确几何。自然天气相对 Selection Only 净增 13 个正确目标；27 个
        gain 中 9 个在预算截断前原有效 Car 候选也达不到 IoU 0.7，14 个 loss 均涉及高分修正框压制准确框。
      basis: note-summary
      status: source-checked
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
    interpretation:
      text: 区分候选重新选择与几何定位改善；不能以总 AP 或控制恢复数证明每个修正都产生新准确几何，且修复存在 retention 代价。
      basis: analyst-inference
      status: inferred
      evidence:
      - paper: awcr-2026
        stage: first-pass
        anchor: section-07
        status: source-checked
        basis: existing-note
        original_pdf_review_status: source-checked
