    - paper: awcr-2026
      stage: first-pass
      anchor: section-03
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  technical_reason:
    text: 整理者归纳：目标点保持不变不足以保证编码稳定，因为周围观测参与了特征形成。依据是作者报告的受控外部移除、前融合特征变化及区域特征替换结果；作者据此支持 object-region representation pathway，但该综合解释不证明自然天气下全部失败均由此引起（Secs. 3.2–3.4，PDF pp. 3–4）。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: awcr-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  insight:
    text: 把“点是否保留”与“任务如何解释这些点”分开，并联合检查修复收益及原有正确检测/协同帮助的保留。此处是整理者归纳，不是跨天气因果定律。
    basis: analyst-inference
    status: inferred
    evidence:
    - paper: awcr-2026
      stage: first-pass
      anchor: section-04
      status: source-checked
      basis: existing-note
      original_pdf_review_status: source-checked
  contributions:
