name: Export reviewed library to GitHub Pages

# Never publishes on push. Select public content in publish.json first.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the explicitly selected public content to GitHub Pages'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_site.py
      - run: python scripts/check_site.py
      - run: python scripts/export_site.py --profile public
      - run: python scripts/check_site.py --root _site-public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site-public
  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment
